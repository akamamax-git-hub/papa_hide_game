name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'scenario/*.json'
      - 'scripts/**'
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build standalone game
        run: |
          python3 scripts/storyboard.py
          python3 scripts/audit_storyboards.py
          python3 scripts/build.py
      - name: Prepare public files
        env:
          SITE_DIRECTORY: ${{ runner.temp }}/papa-hide-game-site
        run: |
          mkdir -p "$SITE_DIRECTORY"
          cp index.html "$SITE_DIRECTORY/index.html"
          touch "$SITE_DIRECTORY/.nojekyll"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          info = {
              'commit': os.environ['GITHUB_SHA'],
              'built_at': datetime.now(timezone.utc).isoformat(),
          }
          (Path(os.environ['SITE_DIRECTORY']) / 'build-info.json').write_text(json.dumps(info))
          PY
      - name: Upload public files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/papa-hide-game-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
